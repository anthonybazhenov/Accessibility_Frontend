<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="backend.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </div>

    <header class="main-header">
        <div class="header-brand">
            <img src="assets/oakland_logo.png" alt="City of Oakland" class="header-logo">
        </div>
        <div class="header-search">
            <input type="text" class="header-search-input" placeholder="Search" aria-label="Search">
        </div>
    </header>

    <main class="page-content" id="main-content">
        <div class="login-container">
            <div class="login-box">
                <h1>Forgot password</h1>
                <p class="form-footer form-hint">Enter the email for your account. If it exists, we will send a link to set a new password.</p>
                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="forgotEmail">Email</label>
                        <input type="email" id="forgotEmail" autocomplete="email" required>
                    </div>
                    <p id="forgotPasswordError" class="form-error" aria-live="polite"></p>
                    <p id="forgotPasswordOk" class="form-success" aria-live="polite"></p>
                    <button type="submit">Send reset link</button>
                </form>
                <p class="form-footer"><a href="index.html">Back to login</a></p>
            </div>
        </div>
    </main>

    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
