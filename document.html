<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="backend.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </div>

    <main class="documents-main document-viewer-page" id="main-content">
        <div class="document-header-bar">
            <a href="test.html" class="doc-back-link" aria-label="Back to documents" title="Back to documents">
                <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <h1 class="document-title-heading"><span id="docTitle" class="document-header-title">Document</span></h1>
            <div class="document-header-actions-wrap">
                <div class="document-header-actions" id="serverDownloadActions" hidden>
                    <button type="button" class="doc-download-btn" id="downloadHtmlBtn">Download HTML</button>
                    <button type="button" class="doc-download-btn doc-download-btn-secondary" id="downloadPdfBtn" disabled title="Remediated PDF is not generated for this document yet">Download PDF</button>
                </div>
                <span id="docStatus" class="doc-status-badge" role="status" aria-live="polite">Status: —</span>
            </div>
        </div>
        <div class="document-viewer-shell">
            <div class="document-layout">
                <div class="document-card">
                    <div class="document-viewer-frame-wrap">
                        <div id="placeholder" class="document-viewer-placeholder">No document to display.</div>
                        <iframe id="docFrame" title="Document content" style="display: none;"></iframe>
                    </div>
                </div>

                <aside class="document-sidebar" aria-label="Accessibility summary">
                    <div class="panel alterations-panel">
                        <div class="panel-header">
                            <span class="status-circle status-green" aria-hidden="true"></span>
                            <h2 class="panel-title">What we changed</h2>
                        </div>
                        <ul class="issue-list" id="alterationsList">
                            <li class="issue-item alteration-item">Loading…</li>
                        </ul>
                    </div>

                    <div class="panel manual-panel">
                        <div class="panel-header">
                            <span class="status-circle status-yellow" aria-hidden="true"></span>
                            <h2 class="panel-title">Needs your attention</h2>
                        </div>
                        <ul class="issue-list" id="manualIssues">
                            <li class="issue-item">—</li>
                        </ul>
                    </div>

                    <div class="panel ai-panel">
                        <div class="panel-header">
                            <span class="status-circle status-green" aria-hidden="true"></span>
                            <h2 class="panel-title">Notes from the assistant</h2>
                        </div>
                        <ul class="issue-list" id="aiIssues">
                            <li class="issue-item">—</li>
                        </ul>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script>
        (function () {
            if (typeof API_BASE === 'undefined' || !API_BASE || API_BASE === 'https://your-backend-url') return;
            var params = new URLSearchParams(window.location.search);
            if (!params.get('id')) return;
            consumeJwtFromUrlHash();
            var h = typeof authHeaders === 'function' ? authHeaders() : {};
            if (!h['Authorization']) {
                window.location.href = 'index.html?auth=failed';
                return;
            }
            fetch(API_BASE + '/api/person/jwt', { credentials: 'include', headers: h })
                .then(function (res) {
                    if (!res.ok) window.location.href = 'index.html?auth=failed';
                })
                .catch(function () {
                    window.location.href = 'index.html?auth=failed';
                });
        })();
    </script>
    <script>
        /* Local-only viewer (no ?id=): load blob from IndexedDB. Server-backed docs are handled in backend.js only. */
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get('id')) return;

            var placeholder = document.getElementById('placeholder');
            var frame = document.getElementById('docFrame');
            var titleEl = document.getElementById('docTitle');
            var statusEl = document.getElementById('docStatus');
            var DB_NAME = 'ASL_Documents';
            var VIEWER_STORE = 'viewer';

            function openDB() {
                return new Promise(function (resolve, reject) {
                    var r = indexedDB.open(DB_NAME, 2);
                    r.onerror = function () { reject(r.error); };
                    r.onsuccess = function () { resolve(r.result); };
                    r.onupgradeneeded = function () {
                        var db = r.result;
                        if (!db.objectStoreNames.contains(VIEWER_STORE)) {
                            db.createObjectStore(VIEWER_STORE, { keyPath: 'id' });
                        }
                    };
                });
            }

            function getViewerDoc() {
                return openDB().then(function (db) {
                    return new Promise(function (resolve, reject) {
                        var tx = db.transaction(VIEWER_STORE, 'readonly');
                        var req = tx.objectStore(VIEWER_STORE).get('current');
                        req.onsuccess = function () { resolve(req.result || null); };
                        req.onerror = function () { reject(req.error); };
                    });
                });
            }

            function getComplianceStatus(name) {
                if (!name) return 'Compliant';
                return /sample2|non[- ]?compliant|fail/i.test(name) ? 'Non-Compliant' : 'Compliant';
            }

            getViewerDoc().then(function (doc) {
                if (doc && doc.blob) {
                    if (doc.name && titleEl) {
                        titleEl.textContent = doc.name;
                        titleEl.setAttribute('aria-label', 'Open ' + doc.name);
                    }
                    if (statusEl) {
                        var status = getComplianceStatus(doc.name);
                        statusEl.textContent = 'Status: ' + status;
                        statusEl.classList.toggle('is-non-compliant', status === 'Non-Compliant');
                    }
                    var baseUrl = URL.createObjectURL(doc.blob);
                    var viewerUrl = baseUrl + '#toolbar=0&navpanes=0&scrollbar=0';
                    if (frame) frame.src = viewerUrl;
                    if (frame) frame.style.display = 'block';
                    if (placeholder) placeholder.style.display = 'none';
                }
            }).catch(function () {
                if (placeholder) placeholder.textContent = 'Could not load document.';
            });
        })();
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
