<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </div>

    <header class="main-header">
        <div class="header-brand">
            <img src="assets/oakland_logo.png" alt="City of Oakland" class="header-logo">
        </div>
        <div class="header-search">
            <input type="text" class="header-search-input" placeholder="Search" aria-label="Search">
        </div>
    </header>

    <main class="page-content" id="main-content">
        <div class="login-container">
            <div class="login-box register-box">
                <h1>Register</h1>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Full name</label>
                        <input type="text" id="name" placeholder="name" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="password" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" placeholder="confirm password" autocomplete="new-password" required>
                    </div>
                    <p id="registerFormError" class="form-error" aria-live="polite"></p>
                    <button type="submit">Create account</button>
                </form>
                <p class="form-footer">
                    Already have an account? <a href="index.html">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const username = document.getElementById('username');
            const passwordEl = document.getElementById('password');
            const confirmPasswordEl = document.getElementById('confirmPassword');
            const errorEl = document.getElementById('registerFormError');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            function showError(message) {
                errorEl.textContent = message;
            }

            function clearError() {
                errorEl.textContent = '';
            }

            [name, email, username, passwordEl, confirmPasswordEl].forEach(function (input) {
                input.setAttribute('aria-invalid', 'false');
            });

            if (!name.value.trim() || !email.value.trim() || !username.value.trim() || !password || !confirmPassword) {
                showError('Please fill out all required fields.');
                [name, email, username, passwordEl, confirmPasswordEl].forEach(function (input) {
                    if (!input.value.trim()) input.setAttribute('aria-invalid', 'true');
                });
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                passwordEl.setAttribute('aria-invalid', 'true');
                confirmPasswordEl.setAttribute('aria-invalid', 'true');
                return;
            }

            // For now, redirect to login after "register"
            clearError();
            window.location.href = 'index.html';
        });
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
