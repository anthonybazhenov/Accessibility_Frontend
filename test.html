<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Documents - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="backend.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </div>

    <header class="main-header">
        <div class="header-brand">
            <img src="assets/oakland_logo.png" alt="City of Oakland" class="header-logo">
        </div>
        <div class="header-actions">
            <span class="account-name"><span class="visually-hidden">Logged in as: </span>Test Test</span>
            <button type="button" class="icon-btn" aria-label="Menu" title="Menu">
                <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <a href="index.html" class="icon-btn" aria-label="Logout" title="Logout">
                <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </a>
        </div>
    </header>

    <main class="documents-main" id="main-content">
        <div class="documents-bar">
            <h1 class="documents-title">Your Documents</h1>
            <div class="documents-actions">
                <input type="file" id="fileUpload" accept=".pdf,.doc,.docx" multiple hidden>
                <button type="button" class="icon-btn icon-btn-add" id="addDocBtn" aria-label="Upload document" title="Upload document">
                    <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button type="button" class="icon-btn icon-btn-trash" id="deleteDocBtn" aria-label="Delete selected" title="Delete selected">
                    <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>

        <div class="documents-table-wrap">
            <table class="documents-table">
                <caption class="visually-hidden">Your uploaded documents</caption>
                <thead>
                    <tr>
                        <th class="th-select" scope="col"><input type="checkbox" id="selectAll" aria-label="Select all"></th>
                        <th scope="col">Document Name</th>
                        <th scope="col">Date Added</th>
                        <th scope="col">Size</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody id="documentsBody">
                    <!-- Empty initially; rows added when user uploads -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Dashboard uploads + table: backend.js only (duplicate inline handlers cleared file input before POST could run) -->
    <script>
        (function () {
            if (typeof API_BASE === 'undefined' || !API_BASE || API_BASE === 'https://your-backend-url') return;
            consumeJwtFromUrlHash();
            var h = typeof authHeaders === 'function' ? authHeaders() : {};
            if (!h['Authorization']) {
                window.location.href = 'index.html?auth=failed';
                return;
            }
            fetch(API_BASE + '/api/person/jwt', {
                credentials: 'include',
                headers: h
            })
                .then(function (res) {
                    if (!res.ok) {
                        window.location.href = 'index.html?auth=failed';
                    }
                })
                .catch(function () {
                    window.location.href = 'index.html?auth=failed';
                });
        })();
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
