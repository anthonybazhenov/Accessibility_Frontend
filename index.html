<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>
<body>
    <header class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </header>

    <header class="main-header">
        <div class="header-brand">
            <img src="assets/oakland_logo.png" alt="City of Oakland" class="header-logo">
        </div>
        <div class="header-search">
            <input type="text" class="header-search-input" placeholder="Search" aria-label="Search">
        </div>
    </header>

    <div class="page-content">
        <div class="login-container">
            <div class="login-box">
                <h1>Login</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <input type="text" id="username" placeholder="username" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
                <p class="form-footer form-hint" id="loginError" role="alert" style="display: none; color: #c00;"></p>
                <p class="form-footer">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        (function () {
            try {
                var q = new URLSearchParams(window.location.search);
                if (q.get('auth') === 'failed') {
                    var el = document.getElementById('loginError');
                    if (el) {
                        el.textContent = 'Could not verify your session on the dashboard. Try logging in again.';
                        el.style.display = 'block';
                    }
                }
            } catch (e) {}
        })();
    </script>
    <script>
        (function () {
            var form = document.getElementById('loginForm');
            var submitBtn = form.querySelector('button[type="submit"]');
            var errorEl = document.getElementById('loginError');

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                if (!username || !password) {
                    showError('Please enter both username and password');
                    return;
                }

                if (!API_BASE || API_BASE === 'https://your-backend-url') {
                    showError('Configure API_BASE in config.js');
                    return;
                }

                setLoading(true);
                hideError();

                fetch(API_BASE + '/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: username, password: password })
                })
                    .then(function (res) {
                        if (!res.ok) {
                            return res.text().then(function (text) {
                                throw new Error(text || 'Login failed');
                            });
                        }
                        var hdrToken = res.headers.get('X-JWT-Token') || res.headers.get('x-jwt-token');
                        function finishLogin(token) {
                            if (!token) {
                                setLoading(false);
                                showError('Login succeeded on the server but the browser did not receive a token. Hard-refresh (Cmd+Shift+R) and try again. API_BASE: ' + API_BASE);
                                return;
                            }
                            setStoredJwt(token);
                            // Hash carries token even if storage is flaky across navigation
                            window.location.href = 'test.html#asl_token=' + encodeURIComponent(token);
                        }
                        return res.clone().json().then(function (data) {
                            var token = hdrToken || (data && (data.token || data.access_token));
                            finishLogin(token);
                        }).catch(function () {
                            return res.text().then(function (text) {
                                var token = hdrToken;
                                if (!token && text) {
                                    try {
                                        var data = JSON.parse(text);
                                        if (data && data.token) token = data.token;
                                    } catch (e) {}
                                }
                                if (!token && text) {
                                    var m = text.match(/"token"\s*:\s*"([^"]+)"/);
                                    if (m) token = m[1];
                                }
                                finishLogin(token);
                            });
                        });
                    })
                    .catch(function (err) {
                        setLoading(false);
                        if (err.message && (err.message.toLowerCase().indexOf('invalid') !== -1 || err.message.indexOf('credentials') !== -1)) {
                            showError('Invalid username or password');
                        } else if (err.message && (err.message.toLowerCase().indexOf('fetch') !== -1 || err.message.toLowerCase().indexOf('load') !== -1 || err.message === 'Failed to fetch')) {
                            showError('Cannot reach server. Check config.js and that the backend is running at ' + API_BASE + '.');
                        } else {
                            showError('Login failed. Please try again.');
                        }
                    });
            });

            function setLoading(loading) {
                submitBtn.disabled = loading;
                submitBtn.textContent = loading ? 'Logging in…' : 'Login';
            }

            function showError(msg) {
                if (errorEl) {
                    errorEl.textContent = msg;
                    errorEl.style.display = 'block';
                }
            }

            function hideError() {
                if (errorEl) {
                    errorEl.textContent = '';
                    errorEl.style.display = 'none';
                }
            }
        })();
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
