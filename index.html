<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="backend.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </div>

    <header class="main-header">
        <div class="header-brand">
            <img src="assets/oakland_logo.png" alt="City of Oakland" class="header-logo">
        </div>
        <div class="header-search">
            <input type="text" class="header-search-input" placeholder="Search" aria-label="Search">
        </div>
    </header>

    <main class="page-content" id="main-content">
        <div class="login-container">
            <div class="login-box">
                <h1>Login</h1>
                <p id="loginBanner" class="form-success" style="display:none;" aria-live="polite"></p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
                    </div>
                    <p id="loginFormError" class="form-error" aria-live="polite"></p>
                    <button type="submit">Login</button>
                </form>
                <p class="form-footer">
                    <a href="forgot-password.html">Forgot password?</a>
                </p>
                <p class="form-footer">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        (function () {
            try {
                var q = new URLSearchParams(window.location.search);
                if (q.get('reset') === 'ok') {
                    var b = document.getElementById('loginBanner');
                    if (b) {
                        b.textContent = 'Password updated. You can sign in.';
                        b.style.display = 'block';
                    }
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState({}, '', 'index.html');
                    }
                }
            } catch (e) {}
        })();
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
