<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City of Oakland</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="top-bar">
        <button type="button" class="high-contrast-toggle" id="highContrastToggle" aria-pressed="false">High Contrast</button>
    </div>

    <header class="main-header">
        <div class="header-brand">
            <img src="assets/oakland_logo.png" alt="City of Oakland" class="header-logo">
        </div>
        <div class="header-search">
            <input type="text" class="header-search-input" placeholder="Search" aria-label="Search">
        </div>
    </header>

    <main class="page-content" id="main-content">
        <div class="login-container">
            <div class="login-box">
                <h1>Login</h1>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
                    </div>
                    <p id="loginFormError" class="form-error" aria-live="polite"></p>
                    <button type="submit">Login</button>
                </form>
                <p class="form-footer form-hint">
                    Test login: <strong>test</strong> / <strong>test</strong>
                </p>
                <p class="form-footer">
                    Don't have an account? <a href="register.html">Register</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Temporary test login (remove when real auth is added)
        const TEST_USERNAME = 'test';
        const TEST_PASSWORD = 'test';

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorEl = document.getElementById('loginFormError');

            function showError(message) {
                errorEl.textContent = message;
            }

            function clearError() {
                errorEl.textContent = '';
            }

            usernameInput.setAttribute('aria-invalid', 'false');
            passwordInput.setAttribute('aria-invalid', 'false');

            if (!username || !password) {
                showError('Please enter both username and password.');
                if (!username) usernameInput.setAttribute('aria-invalid', 'true');
                if (!password) passwordInput.setAttribute('aria-invalid', 'true');
                return;
            }

            if (username === TEST_USERNAME && password === TEST_PASSWORD) {
                clearError();
                window.location.href = 'test.html';
            } else {
                showError('Invalid username or password.');
                usernameInput.setAttribute('aria-invalid', 'true');
                passwordInput.setAttribute('aria-invalid', 'true');
            }
        });
    </script>
    <script>
        (function () {
            var toggle = document.getElementById('highContrastToggle');
            var key = 'highContrast';
            function apply() {
                var on = localStorage.getItem(key) === 'true';
                document.body.classList.toggle('high-contrast-mode', on);
                document.documentElement.classList.toggle('high-contrast-mode', on);
                if (toggle) toggle.setAttribute('aria-pressed', on);
                if (toggle) toggle.textContent = on ? 'Default' : 'High Contrast';
            }
            if (toggle) {
                toggle.addEventListener('click', function () {
                    var on = localStorage.getItem(key) !== 'true';
                    localStorage.setItem(key, on ? 'true' : 'false');
                    apply();
                });
            }
            apply();
        })();
    </script>
</body>
</html>
